# Blocs Nginx pour mameboufall.com — à AJOUTER dans /opt/ftf/docker/nginx.conf
# (monté dans ftf-frontend-prod). Ne remplace PAS falltradingfarmer.com.
#
# Prérequis : conteneur portfolio sur le réseau Docker `ftf-prod`
# et certificats dans /opt/ftf/certbot/conf/live/mameboufall.com/

upstream portfolio_upstream {
    server portfolio-mamebou-fall:3000;
}

server {
    listen 80;
    server_name mameboufall.com www.mameboufall.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://mameboufall.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mameboufall.com www.mameboufall.com;

    ssl_certificate     /etc/nginx/ssl/live/mameboufall.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/mameboufall.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
