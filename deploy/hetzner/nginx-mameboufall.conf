# Blocs Nginx à AJOUTER dans /opt/ftf/docker/nginx.conf
# (monté dans ftf-frontend-prod → /etc/nginx/conf.d/default.conf).
# Ne remplace PAS les server_name falltradingfarmer.com.
#
# Le portfolio doit être sur le réseau Docker `ftf-prod`
# (voir docker-compose.hetzner.yml).

upstream portfolio_upstream {
    server portfolio-mamebou-fall:3000;
}

# HTTP : ACME + proxy (avant SSL) ; après Certbot → redirect HTTPS
server {
    listen 80;
    server_name mameboufall.com www.mameboufall.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

