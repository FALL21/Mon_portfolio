# Site Nginx pour mameboufall.com
# Proxy vers le conteneur Docker (127.0.0.1:3010).
# N'écrase PAS les autres vhosts (ex. FTF / Fall Trading Farmer).
#
# Installation :
#   sudo cp deploy/hetzner/nginx-mameboufall.conf /etc/nginx/sites-available/mameboufall.com
#   sudo ln -sf /etc/nginx/sites-available/mameboufall.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Après bascule DNS vers 46.224.76.38 :
#   sudo certbot --nginx -d mameboufall.com -d www.mameboufall.com

server {
    listen 80;
    listen [::]:80;
    server_name mameboufall.com www.mameboufall.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
