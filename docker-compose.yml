services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-mamebou-fall:latest
    container_name: portfolio-mamebou-fall
    restart: unless-stopped
    ports:
      # Local : 3000:3000 (défaut)
      # Prod Hetzner : PORTFOLIO_PUBLISH=127.0.0.1:3010
      - "${PORTFOLIO_PUBLISH:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
